
spring:
  application:
    name: products

  datasource:
    url: jdbc:h2:mem:productsdb
    username: sa
    password: sc
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  h2:
    console:
      enabled: true

logging:
  level:
    root: INFO
  pattern:
    console: '{"time":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","service":"%X{spring.application.name}","thread":"%t","logger":"%c","message":"%m"}%n'

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      show-details: always
server:
  port: 8082

security:
  api-key: ${SPRING_SECURITY_API_KEY:secret-key}

